<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/image/icon.jpg" type="image/jpg">
    <title>Health Survey</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 25px;
            margin-bottom: 25px;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #007bff;
            font-weight: 700;
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 40px;
        }

        .question-label {
            font-size: 1.2em;
            color: #444;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .question-options input {
            display: none;
        }

        .question-options label {
            padding-left: 35px;
            position: relative;
            cursor: pointer;
            font-size: 1.1em;
        }

        .question-options label::before {
            content: "";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #ddd;
            transition: background-color 0.2s, transform 0.2s;
        }

        .question-options input:checked+label::before {
            background-color: #007bff;
            transform: translateY(-50%) scale(1.2);
        }

        .question-options input:checked+label {
            color: #007bff;
            font-weight: bold;
        }

        /* Icon Styles */
        .question-label i {
            margin-right: 10px;
            color: #007bff;
        }

        .question-options label i {
            margin-right: 10px;
            color: #888;
        }

        .btn-next {
            background-color: #007bff;
            color: white;
            font-size: 1.2em;
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            border: none;
            transition: background-color 0.3s;
        }

        .btn-next:hover {
            background-color: #0056b3;
        }

        .footer {
            text-align: center;
            font-size: 0.9em;
            color: #777;
            margin-top: 40px;
        }

        /* Mobile-first design */
        @media (max-width: 576px) {
            h2 {
                font-size: 1.8em;
            }

            .btn-next {
                font-size: 1em;
                padding: 12px;
            }

            .question-options label {
                font-size: 1em;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Health Survey</h2>

        <form id="surveyForm">
            <!-- Question 1 -->
            <div class="card">
                <div class="question">
                    <label class="question-label" for="q1"><i class="fas fa-running"></i>1. How often do you exercise?</label>
                    <div class="question-options">
                        <input type="radio" name="q1" value="Daily" id="q1-daily" required>
                        <label for="q1-daily"><i class="fas fa-check-circle"></i>Daily</label>

                        <input type="radio" name="q1" value="Sometimes" id="q1-sometimes">
                        <label for="q1-sometimes"><i class="fas fa-check-circle"></i>Sometimes</label>

                        <input type="radio" name="q1" value="Never" id="q1-never">
                        <label for="q1-never"><i class="fas fa-check-circle"></i>Never</label>
                    </div>
                </div>
            </div>

            <!-- Question 2 -->
            <div class="card">
                <div class="question">
                    <label class="question-label" for="q2"><i class="fas fa-apple-alt"></i>2. Do you have any dietary restrictions?</label>
                    <div class="question-options">
                        <input type="radio" name="q2" value="Yes" id="q2-yes" required>
                        <label for="q2-yes"><i class="fas fa-check-circle"></i>Yes</label>

                        <input type="radio" name="q2" value="No" id="q2-no">
                        <label for="q2-no"><i class="fas fa-check-circle"></i>No</label>
                    </div>
                </div>
            </div>

            <!-- Question 3 -->
            <div class="card">
                <div class="question">
                    <label class="question-label" for="q3"><i class="fas fa-stethoscope"></i>3. How often do you visit a doctor?</label>
                    <div class="question-options">
                        <input type="radio" name="q3" value="Regularly" id="q3-regularly" required>
                        <label for="q3-regularly"><i class="fas fa-check-circle"></i>Regularly</label>

                        <input type="radio" name="q3" value="Occasionally" id="q3-occasionally">
                        <label for="q3-occasionally"><i class="fas fa-check-circle"></i>Occasionally</label>

                        <input type="radio" name="q3" value="Never" id="q3-never">
                        <label for="q3-never"><i class="fas fa-check-circle"></i>Never</label>
                    </div>
                </div>
            </div>

            <!-- Question 4 -->
            <div class="card">
                <div class="question">
                    <label class="question-label" for="q4"><i class="fas fa-smoking-ban"></i>4. Do you smoke?</label>
                    <div class="question-options">
                        <input type="radio" name="q4" value="Yes" id="q4-yes" required>
                        <label for="q4-yes"><i class="fas fa-check-circle"></i>Yes</label>

                        <input type="radio" name="q4" value="No" id="q4-no">
                        <label for="q4-no"><i class="fas fa-check-circle"></i>No</label>
                    </div>
                </div>
            </div>

            <!-- Question 5 -->
            <div class="card">
                <div class="question">
                    <label class="question-label" for="q5"><i class="fas fa-beer"></i>5. Do you drink alcohol?</label>
                    <div class="question-options">
                        <input type="radio" name="q5" value="Yes" id="q5-yes" required>
                        <label for="q5-yes"><i class="fas fa-check-circle"></i>Yes</label>

                        <input type="radio" name="q5" value="No" id="q5-no">
                        <label for="q5-no"><i class="fas fa-check-circle"></i>No</label>
                    </div>
                </div>
            </div>

            <!-- Question 6 -->
            <div class="card">
                <div class="question">
                    <label class="question-label" for="q6"><i class="fas fa-bed"></i>6. How many hours of sleep do you get on average?</label>
                    <div class="question-options">
                        <input type="radio" name="q6" value="Less than 5" id="q6-less-5" required>
                        <label for="q6-less-5"><i class="fas fa-check-circle"></i>Less than 5</label>

                        <input type="radio" name="q6" value="5-7 hours" id="q6-5-7">
                        <label for="q6-5-7"><i class="fas fa-check-circle"></i>5-7 hours</label>

                        <input type="radio" name="q6" value="More than 7" id="q6-more-7">
                        <label for="q6-more-7"><i class="fas fa-check-circle"></i>More than 7</label>
                    </div>
                </div>
            </div>

            <!-- Question 7 -->
            <div class="card">
                <div class="question">
                    <label class="question-label" for="q7"><i class="fas fa-heartbeat"></i>7. Do you have any chronic illnesses?</label>
                    <div class="question-options">
                        <input type="radio" name="q7" value="Yes" id="q7-yes" required>
                        <label for="q7-yes"><i class="fas fa-check-circle"></i>Yes</label>

                        <input type="radio" name="q7" value="No" id="q7-no">
                        <label for="q7-no"><i class="fas fa-check-circle"></i>No</label>
                    </div>
                </div>
            </div>

            <!-- Next Button -->
            <button type="submit" class="btn btn-next">Submit and Next</button>
        </form>
    </div>

    <div class="footer">
        <p>&copy; 2024 Health Survey. All rights reserved.</p>
    </div>

    <!-- Bootstrap JS and Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script>
document.getElementById("surveyForm").addEventListener("submit", function(event) {
    event.preventDefault();  // Prevent form submission to allow for handling via JS
    
    const form = event.target;
    const answers = {};

    // Loop through each question and collect answers
    const questions = form.querySelectorAll('.question');
    questions.forEach((question, index) => {
        const questionLabel = question.querySelector('.question-label').textContent.trim();
        const selectedOption = question.querySelector('input[type="radio"]:checked');

        if (selectedOption) {
            answers[questionLabel] = selectedOption.nextElementSibling.textContent.trim();
        }
    });

    // Save answers to localStorage
    localStorage.setItem('healthSurveyAnswers', JSON.stringify(answers));

    // Redirect to the next page
    window.location.href = "chatPage.html"; // Replace "nextPage.html" with the actual page you want to redirect to
});

    </script>
</body>

</html>
