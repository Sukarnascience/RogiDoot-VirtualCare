<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./assets/image/icon.jpg" type="image/jpg">
    <title>Device Information</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <!-- PDFMake for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.70/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.70/vfs_fonts.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding-top: 50px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #007bff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn-submit {
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        #message-container {
            margin-top: 30px;
        }

        #response {
            margin-top: 20px;
            padding: 20px;
            background-color: #f1f1f1;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .btn-download {
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-download:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Enter IP Address of "ROOGI DOOT" Device</h2>
        <form id="ipForm">
            <div class="form-group">
                <label for="ipAddress">IP Address</label>
                <input type="text" id="ipAddress" class="form-control" placeholder="Enter IP Address" required>
            </div>
            <button type="submit" class="btn-submit">Submit</button>
        </form>

        <div id="message-container" class="d-none">
            <h3>Combined Data:</h3>
            <p id="combinedData"></p>
            <div id="response"></div>
            <button class="btn-download" id="downloadBtn" onclick="downloadPDF()">Download as PDF</button>
        </div>
    </div>

    <script>
        // Handle form submission and fetch the data from IP address
        document.getElementById('ipForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const ipAddress = document.getElementById('ipAddress').value;
            if (!ipAddress) {
                alert('Please enter an IP address.');
                return;
            }

            // Simulate fetching machine data from the device via IP address
            const jsonData = await getDeviceData(ipAddress); // Replace with actual function

            // Get data from localStorage
            const healthSurveyAnswers = JSON.parse(localStorage.getItem('healthSurveyAnswers')) || {};
            const currentMember = JSON.parse(localStorage.getItem('currentMember')) || {};
            const whatstheissue = JSON.parse(localStorage.getItem('whatstheissue')) || {};

            // Store whatstheissue in localStorage after API response (modify this after API call)
            localStorage.setItem('whatstheissue', JSON.stringify(whatstheissue));

            // Combine all the data into a single paragraph
            const combinedData = `
                Device Info: ${JSON.stringify(jsonData, null, 2)}\n\n
                Health Survey Answers: ${JSON.stringify(healthSurveyAnswers, null, 2)}\n\n
                Current Member Info: ${JSON.stringify(currentMember, null, 2)}\n\n
                Issues: ${JSON.stringify(whatstheissue, null, 2)}
            `;

            document.getElementById('combinedData').innerText = combinedData;
            document.getElementById('message-container').classList.remove('d-none');

            // Send data to the backend API
            const message = combinedData;
            console.log('Sending message to the server:', message);

            const response = await fetch('http://localhost:8080/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message,
                    memberName: currentMember.name,
                    dob: currentMember.dob,
                    gender: currentMember.gender,
                    diseases: currentMember.diseases,
                }),
            });
            const responseData = await response.json();
            document.getElementById('response').innerText = `Bot's Response: ${responseData.message}`;
        });


        // Function to simulate fetching device data or use dummy data if the connection fails
        async function getDeviceData(ipAddress) {
            try {
                // Simulating fetching from a device via IP (using mock data for this example)
                const response = await fetch(`http://${ipAddress}/deviceData`);
                if (!response.ok) {
                    throw new Error('Failed to connect');
                }
                return await response.json(); // If successful, return the JSON data
            } catch (error) {
                console.log('Connection failed. Using dummy data.');
                // Return default (dummy) data in case of failure
                return {
                    BP: "120/80 mmHg",
                    O2: "98%",
                    EEG: "Normal",
                    Temp_of_env: "22°C",
                    Humi_of_env: "50%",
                    Smoke_is_thereornot: "No"
                };
            }
        }

        // Function to download the bot's response as PDF
        function downloadPDF() {
            const responseText = document.getElementById('response').innerText;

            const docDefinition = {
                content: [
                    { text: 'Bot Response', style: 'header' },
                    { text: responseText, style: 'content' },
                ],
                styles: {
                    header: {
                        fontSize: 18,
                        bold: true,
                        alignment: 'center',
                        marginBottom: 20,
                    },
                    content: {
                        fontSize: 12,
                        marginBottom: 20,
                    },
                },
            };

            pdfMake.createPdf(docDefinition).download('bot_response.pdf');
        }
    </script>
</body>
</html>
